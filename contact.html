<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Spark</title>
<meta name="description" content="Get in touch with the Spark team.">
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=1">
</head>
<body class="page-contact">

<header class="nav" id="nav">
  <div class="nav__inner">
    <a class="logo" href="index.html" aria-label="Spark home">
      <img src="assets/logo.svg" alt="Spark" width="913" height="219">
    </a>
    <nav class="nav__links">
      <a href="index.html#about">About</a>
      <a href="index.html#map">Map</a>
      <a class="btn btn--solid" href="contact.html" aria-current="page">Let's talk</a>
    </nav>
  </div>
</header>

<main class="contact">
  <div class="wrap">
    <h1 class="contact__title">Contact us</h1>

    <h2 class="contact__lede">Get in touch</h2>

    <!-- Wire FORM_ENDPOINT in js/contact.js to post somewhere.
         With it unset, submitting opens the visitor's mail client. -->
    <form class="cform" id="cform" novalidate>

      <div class="field">
        <span class="field__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
               stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="3.6"/>
            <path d="M4.5 20a7.5 7.5 0 0 1 15 0"/>
          </svg>
        </span>
        <input id="name" name="name" type="text" autocomplete="name"
               placeholder="ENTER FULL NAME" required>
        <label class="sr-only" for="name">Full name</label>
      </div>

      <div class="cform__row">
        <div class="field">
          <span class="field__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                 stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5" width="18" height="14" rx="2.5"/>
              <path d="m3.6 6.5 7.5 5.3a1.6 1.6 0 0 0 1.8 0l7.5-5.3"/>
            </svg>
          </span>
          <input id="email" name="email" type="email" autocomplete="email"
                 placeholder="ENTER EMAIL" required>
          <label class="sr-only" for="email">Email</label>
        </div>

        <div class="field">
          <span class="field__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                 stroke-linecap="round" stroke-linejoin="round">
              <rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/>
              <path d="M11 18.6h2"/>
            </svg>
          </span>
          <input id="phone" name="phone" type="tel" autocomplete="tel"
                 placeholder="ENTER PHONE">
          <label class="sr-only" for="phone">Phone (optional)</label>
        </div>
      </div>

      <div class="field field--area">
        <span class="field__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 6.5h14M9.5 6.5v11"/>
          </svg>
        </span>
        <textarea id="message" name="message" rows="4"
                  placeholder="ENTER MESSAGE" required></textarea>
        <label class="sr-only" for="message">Message</label>
      </div>

      <p class="cform__error" id="cformError" role="alert" hidden></p>

      <button class="cbtn" type="submit">Send message</button>

      <p class="cform__ok" id="cformOk" role="status" hidden>
        Thanks — your message is on its way.
      </p>
    </form>
  </div>
</main>

<footer class="foot">
  <div class="wrap foot__inner">
    <span class="logo__word">SPARK 2026</span>
    <p>An emotional weather station for the places we share.</p>
  </div>
</footer>

<script src="js/contact.js?v=1"></script>
</body>
</html>
